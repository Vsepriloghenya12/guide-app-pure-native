name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspaces (server + webapp)
        run: npm ci
      - name: Webapp typecheck + build
        run: npm run build --workspace webapp
      - name: Server syntax check
        run: |
          node --check server/src/index.js
          node --check server/src/db.js
          node --check server/src/publicAuth.js
      - name: Server smoke tests (auth gating, rate limit)
        run: npm test --workspace server

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile deps
        run: npm ci
      - name: Mobile typecheck
        run: npx tsc --noEmit
      - name: Mobile unit tests
        run: npm test
