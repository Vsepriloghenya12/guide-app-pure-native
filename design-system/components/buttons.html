<!-- @dsCard group="Компоненты" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Кнопки — Da Nang Guide</title>
<style>
  body{margin:0;padding:28px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f5f7fb;display:flex;flex-direction:column;gap:18px;max-width:420px}
  .lbl{color:#8493a8;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:-8px}
  .btn-primary{min-height:48px;border:0;border-radius:15px;background:#1f63c7;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn-ghost{min-height:48px;border:1px solid #dfe7f1;border-radius:15px;background:#fff;color:#102a43;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .cta{display:inline-flex;align-items:center;gap:7px;align-self:center;border:0;cursor:pointer;background:#1f63c7;color:#fff;font-size:15px;font-weight:800;padding:14px 24px;border-radius:999px;box-shadow:0 6px 12px rgba(11,43,87,.35);font-family:inherit}
  .go-row{display:flex;gap:10px}
  .go{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;background:#1f63c7;color:#fff;font-size:14px;font-weight:800;padding:13px;border-radius:14px;font-family:inherit}
  .share{width:52px;border:1px solid #dbe3ee;background:#fff;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .circle{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px rgba(11,43,87,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#20304c;font-weight:800}
  .zoom{width:42px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(11,43,87,.18)}
  .zoom button{width:42px;height:41px;border:0;background:#fff;cursor:pointer;font-size:18px;color:#35507a;font-weight:700}
  .zoom .d{height:1px;background:#e6ecf4}
  .back{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;background:#fff;border:1px solid #d8e0ea;border-radius:14px;padding:9px 14px;color:#102a43;font-weight:800;font-size:14px}
  svg{display:block}
</style></head><body>
<div class="lbl">AppButton — primary / ghost</div>
<button class="btn-primary">Маршрут</button>
<button class="btn-ghost">Сайт</button>
<div class="lbl">Плавающая CTA над картой (пилюля)</div>
<button class="cta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4.3" r="2.1" fill="#fff" stroke="none"/><path d="M12 7.4v5.2M12 9.2l-3 1.9M12 9.2l3 1.3M12 12.6l-2.4 6M12 12.6l2.4 6"/></svg>Построить маршрут</button>
<div class="lbl">Панель маршрута — «В путь» + поделиться</div>
<div class="go-row">
  <button class="go"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>В путь</button>
  <button class="share"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#35507a" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="12" r="2.4"/><circle cx="17" cy="6" r="2.4"/><circle cx="17" cy="18" r="2.4"/><path d="M8.1 10.9 14.9 7.2M8.1 13.1 14.9 16.8"/></svg></button>
</div>
<div class="lbl">Контролы карты — круг 42px + зум-панель</div>
<div style="display:flex;gap:12px;align-items:flex-start">
  <button class="circle">✕</button>
  <button class="circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#c7d2e0" stroke-width="1.5"/><path d="M12 5.5 15 12.5 9 12.5Z" fill="#e05a3f"/><path d="M12 18.5 15 12.5 9 12.5Z" fill="#94a1b4"/></svg></button>
  <div class="zoom"><button>+</button><div class="d"></div><button>−</button></div>
</div>
<div class="lbl">Кнопка «Назад» в шапке</div>
<span class="back">‹ Назад</span>
</body></html>
